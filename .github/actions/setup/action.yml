name: Set up Node and pnpm
description: Install locked dependencies with a restore-only pnpm cache.
outputs:
  cache-hit:
    description: Whether the exact pnpm store cache was restored.
    value: ${{ steps.cache.outputs.cache-hit }}
  cache-key:
    description: The primary pnpm store cache key.
    value: ${{ steps.cache.outputs.cache-primary-key }}
  store-path:
    description: The pnpm store directory.
    value: ${{ steps.store.outputs.path }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7.0.0
      with:
        node-version: "24"
        package-manager-cache: false
    - uses: pnpm/action-setup@v6.1.0
      with:
        version: 12.4.2
        run_install: false
        cache: false
    - id: store
      shell: pwsh
      run: |
        $taskStore = pnpm store path --silent
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "path=$taskStore" >> $env:GITHUB_OUTPUT
    - id: cache
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-v1-${{ runner.os }}-${{ runner.arch }}-node24-pnpm12.4.2-${{ github.ref }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
    - shell: pwsh
      run: pnpm install --frozen-lockfile
