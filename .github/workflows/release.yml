name: Release

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

concurrency:
  group: lindvimera-refs/heads/release
  queue: max
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
          persist-credentials: true
      - name: Verify tag and release source
        id: source
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = $env:GITHUB_REF_NAME
          $commit = $env:GITHUB_SHA
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $tag -cnotmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'Use a numeric X.Y.Z tag without a v prefix or prerelease suffix.'
          }
          git fetch --force --no-tags origin '+refs/heads/release:refs/remotes/origin/release' "+refs/tags/${tag}:refs/tags/${tag}"
          if ((git rev-parse "refs/tags/${tag}^{commit}") -cne $commit -or (git rev-parse HEAD) -cne $commit) {
            throw 'The tag or checkout differs from the source commit of this workflow.'
          }
          git merge-base --is-ancestor $commit refs/remotes/origin/release
          $manifest = Get-Content manifest.json -Raw | ConvertFrom-Json
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $versions = Get-Content versions.json -Raw | ConvertFrom-Json -AsHashtable
          if ($manifest.version -cne $tag -or $package.version -cne $tag -or $versions[$tag] -cne $manifest.minAppVersion) {
            throw 'The tag, package, manifest, and versions.json must agree.'
          }
          "version=$tag" >> $env:GITHUB_OUTPUT
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/quality
      - run: pnpm test:unit
      - run: pnpm build
      - name: Prepare pinned Obsidian
        run: ./scripts/probe/prepare-obsidian.ps1
      - name: Test the release distribution
        id: e2e
        run: pnpm test:e2e
      - name: Preserve E2E diagnostics
        if: always() && steps.e2e.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test-runtime/results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
      - name: Validate release contents
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        run: node scripts/release/validate.mjs
      - name: Package the tested distribution
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        run: ./scripts/release/package.ps1
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/notes.mjs --output .release-gate/notes.md
      - name: Attest the tested release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            .release/main.js
            .release/manifest.json
            .release/styles.css
            .release/lindvimera-${{ steps.source.outputs.version }}.zip
            .release/SHA256SUMS
            .release/provenance.json
      - name: Publish verified assets without overwriting releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release/publish.ps1
