name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lindvimera-${{ github.ref }}
  queue: max
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  quality:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/quality

  unit:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:unit

  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
      - id: lindera
        uses: actions/cache/restore@v6.1.0
        with:
          path: .cache/lindera/*.zip
          key: lindera-v1-${{ github.ref }}-${{ hashFiles('scripts/lindera-assets.mjs') }}
      - run: pnpm build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - if: steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ steps.setup.outputs.store-path }}
          key: ${{ steps.setup.outputs.cache-key }}
      - if: steps.lindera.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: .cache/lindera/*.zip
          key: ${{ steps.lindera.outputs.cache-primary-key }}

  e2e:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8.0.1
        with:
          name: candidate-${{ github.sha }}
          path: dist/
      - id: obsidian
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            .cache/obsidian/1.13.7/*.exe
            .cache/obsidian/1.13.7/*.asar.gz
          key: obsidian-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.ref }}-1.13.7-f233dc24896b3f2d5f9e4b01111181a561d0760b2105f0a474024c5f3143a9bc-69253e39aa0b980e3cf96e9e8a8a4bed6b6481ef7021cd762f67872662d8d25a
      - name: Prepare pinned Obsidian
        run: ./scripts/probe/prepare-obsidian.ps1
      - run: pnpm test:e2e
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-${{ github.sha }}
          path: .test-runtime/results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - if: success() && steps.obsidian.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            .cache/obsidian/1.13.7/*.exe
            .cache/obsidian/1.13.7/*.asar.gz
          key: ${{ steps.obsidian.outputs.cache-primary-key }}

  release-ready:
    if: always()
    needs: [quality, unit, build, e2e]
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Require every check to pass
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          $taskChecks = $env:CHECK_RESULTS | ConvertFrom-Json -AsHashtable
          foreach ($taskCheck in $taskChecks.GetEnumerator()) {
            if ($taskCheck.Value.result -ne 'success') {
              throw "$($taskCheck.Key) did not pass: $($taskCheck.Value.result)"
            }
          }
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: candidate-${{ github.sha }}
          path: dist/
      - name: Validate release contents
        id: verify
        run: node scripts/release/validate.mjs
      - name: Package the tested distribution
        env:
          RELEASE_VERSION: ${{ steps.verify.outputs.version }}
        run: ./scripts/release/package.ps1
